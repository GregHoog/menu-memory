<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Menu Memory</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Menu Memory">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#c2410c">
<style>
:root{--bg:#fffaf5;--card:#fff;--ink:#1c1917;--mute:#78716c;--line:#e7e0d8;--accent:#c2410c;--star:#f59e0b;--good:#15803d;--bad:#b91c1c}
@media (prefers-color-scheme:dark){:root{--bg:#1a1613;--card:#26201c;--ink:#f5efe9;--mute:#a8a098;--line:#3a322c;--accent:#fb923c;--good:#4ade80;--bad:#f87171}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,system-ui,sans-serif;padding-bottom:env(safe-area-inset-bottom)}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:calc(env(safe-area-inset-top) + 10px) 16px 10px;display:flex;align-items:center;gap:10px}
header h1{font-size:20px;margin:0;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
main{padding:12px 16px 90px;max-width:640px;margin:0 auto}
button,.btn{font:inherit;border:0;border-radius:12px;padding:10px 16px;background:var(--accent);color:#fff;font-weight:600;cursor:pointer}
button.ghost{background:transparent;color:var(--accent);padding:8px}
button.sec{background:var(--card);color:var(--ink);border:1px solid var(--line)}
button.danger{background:transparent;color:var(--bad)}
button:disabled{opacity:.5}
input,textarea,select{font:inherit;width:100%;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
textarea{min-height:80px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1;min-width:0}
.mute{color:var(--mute);font-size:14px}
.stars{color:var(--star);letter-spacing:1px;white-space:nowrap}
.stars .off{color:var(--line)}
.fab{position:fixed;right:16px;bottom:calc(env(safe-area-inset-bottom) + 16px);box-shadow:0 4px 14px #0004;border-radius:28px;padding:14px 20px;z-index:6}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--mute);margin:20px 0 8px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 10px}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:6px 14px;border-radius:20px;white-space:nowrap;font-weight:500}
.chip.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.dish{display:flex;gap:10px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line)}
.dish:last-child{border:0}
.price{color:var(--mute);font-variant-numeric:tabular-nums}
.sheet{position:fixed;inset:0;background:#0008;z-index:20;display:flex;align-items:flex-end}
.sheet>div{background:var(--bg);width:100%;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:18px 16px calc(env(safe-area-inset-bottom) + 18px);max-width:640px;margin:0 auto}
.bigstars{display:flex;justify-content:space-between;font-size:44px;margin:8px 0 14px}
.bigstars span{cursor:pointer;color:var(--line);padding:0 4px}
.bigstars span.on{color:var(--star)}
.tag{font-size:12px;padding:2px 8px;border-radius:10px;background:var(--line)}
.empty{text-align:center;color:var(--mute);padding:50px 20px}
.err{color:var(--bad);margin:8px 0}
label{display:block;font-size:14px;color:var(--mute);margin:12px 0 4px}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.thumbs img{width:72px;height:72px;object-fit:cover;border-radius:10px;border:1px solid var(--line)}
</style>
</head>
<body>
<header id="hdr"></header>
<main id="main"></main>
<div id="sheet"></div>

<script>
// ---------- storage ----------
const KEY = "menumemory.v1";
let db = (() => { try { return JSON.parse(localStorage.getItem(KEY)) || {restaurants: []}; } catch { return {restaurants: []}; } })();
const save = () => localStorage.setItem(KEY, JSON.stringify(db));
const uid = () => Math.random().toString(36).slice(2, 10);
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const stars = (n) => n ? `<span class="stars">${"★".repeat(n)}<span class="off">${"★".repeat(5 - n)}</span></span>` : `<span class="mute">not rated</span>`;

// ---------- state / routing ----------
let view = {name: "home"};
let filter = "all", q = "";
const go = (v) => { view = v; render(); window.scrollTo(0, 0); };
const rest = () => db.restaurants.find((r) => r.id === view.id);

function render() {
  const h = $("#hdr"), m = $("#main");
  if (view.name === "home") home(h, m);
  else if (view.name === "rest") restaurant(h, m);
  else if (view.name === "add") addMenu(h, m);
}

// ---------- home ----------
function home(h, m) {
  h.innerHTML = `<h1>🍽️ Menu Memory</h1><button class="ghost" onclick="settings()">⚙︎</button>`;
  const list = db.restaurants.slice().sort((a, b) => b.created - a.created);
  const ql = q.toLowerCase();
  // search across restaurants and dishes
  const hits = ql ? list.map((r) => ({r, dishes: r.sections.flatMap((s) => s.dishes).filter((d) => d.name.toLowerCase().includes(ql))}))
                      .filter((x) => x.r.name.toLowerCase().includes(ql) || x.dishes.length) : list.map((r) => ({r, dishes: []}));
  m.innerHTML = `<input id="q" type="search" placeholder="Search restaurants or dishes" value="${esc(q)}">` +
    (hits.length ? hits.map(({r, dishes}) => {
      const all = r.sections.flatMap((s) => s.dishes), rated = all.filter((d) => d.rating);
      return `<div class="card" onclick="go({name:'rest',id:'${r.id}'})">
        <div class="row"><div class="grow"><b>${esc(r.name)}</b><div class="mute">${rated.length} of ${all.length} dishes rated</div></div><span class="mute">›</span></div>
        ${dishes.map((d) => `<div class="mute" style="margin-top:6px">${esc(d.name)} ${stars(d.rating)}</div>`).join("")}</div>`;
    }).join("") : `<div class="empty">${db.restaurants.length ? "No matches." : "No menus yet.<br>Tap “Add menu” to scan your first one."}</div>`) +
    `<button class="fab" onclick="go({name:'add'})">＋ Add menu</button>`;
  const qi = $("#q"); qi.oninput = () => { q = qi.value; const pos = qi.selectionStart; home(h, m); const n = $("#q"); n.focus(); n.setSelectionRange(pos, pos); };
}

// ---------- restaurant ----------
function restaurant(h, m) {
  const r = rest(); if (!r) return go({name: "home"});
  h.innerHTML = `<button class="ghost" onclick="go({name:'home'})">‹ Back</button><h1>${esc(r.name)}</h1><button class="ghost" onclick="restMenu()">•••</button>`;
  const f = {all: () => true, rated: (d) => d.rating, fav: (d) => d.rating >= 4, avoid: (d) => d.rating && d.rating <= 2, todo: (d) => !d.rating}[filter];
  const chips = [["all", "All"], ["fav", "Loved ★4-5"], ["avoid", "Avoid ★1-2"], ["rated", "Tried"], ["todo", "Not rated"]];
  let html = `<div class="chips">${chips.map(([k, l]) => `<button class="chip ${filter === k ? "on" : ""}" onclick="filter='${k}';render()">${l}</button>`).join("")}</div>`;
  let any = false;
  r.sections.forEach((s, si) => {
    const ds = s.dishes.map((d, di) => ({d, di})).filter(({d}) => f(d));
    if (!ds.length) return; any = true;
    html += `<h2>${esc(s.name)}</h2><div class="card" style="padding:0 14px">` + ds.map(({d, di}) => `
      <div class="dish" onclick="dishSheet(${si},${di})">
        <div class="grow"><b>${esc(d.name)}</b>${d.description ? `<div class="mute">${esc(d.description)}</div>` : ""}
          <div style="margin-top:4px">${stars(d.rating)}${d.note ? ` <span class="mute">· ${esc(d.note)}</span>` : ""}</div></div>
        <span class="price">${esc(d.price)}</span></div>`).join("") + `</div>`;
  });
  if (!any) html += `<div class="empty">Nothing here yet.</div>`;
  m.innerHTML = html;
}

function dishSheet(si, di) {
  const r = rest(), d = r.sections[si].dishes[di];
  let rating = d.rating || 0;
  const el = $("#sheet");
  const draw = () => {
    el.innerHTML = `<div class="sheet" onclick="if(event.target===this)$('#sheet').innerHTML=''"><div>
      <b style="font-size:20px">${esc(d.name)}</b><div class="mute">${esc(d.description)}</div>
      <div class="bigstars">${[1,2,3,4,5].map((n) => `<span class="${n <= rating ? "on" : ""}" data-n="${n}">★</span>`).join("")}</div>
      <label>Notes (what you liked or didn't)</label><textarea id="note" placeholder="e.g. great sauce, a bit salty, order again">${esc(d.note || "")}</textarea>
      <div class="row" style="margin-top:14px"><button class="danger" id="del">Delete</button><div class="grow"></div>
        ${d.rating ? `<button class="sec" id="clr">Clear</button>` : ""}<button id="sv">Save</button></div></div></div>`;
    el.querySelectorAll(".bigstars span").forEach((s) => s.onclick = () => { rating = +s.dataset.n === rating ? 0 : +s.dataset.n; d.note = $("#note").value; draw(); $("#note").value = d.note; });
    $("#sv").onclick = () => { d.rating = rating; d.note = $("#note").value.trim(); d.tried = d.tried || (rating ? Date.now() : null); save(); el.innerHTML = ""; render(); };
    const c = $("#clr"); if (c) c.onclick = () => { d.rating = 0; d.tried = null; save(); el.innerHTML = ""; render(); };
    $("#del").onclick = () => { if (confirm("Delete this dish?")) { r.sections[si].dishes.splice(di, 1); save(); el.innerHTML = ""; render(); } };
  };
  draw();
}

function restMenu() {
  const r = rest();
  $("#sheet").innerHTML = `<div class="sheet" onclick="if(event.target===this)this.parentElement.innerHTML=''"><div>
    <button class="sec" style="width:100%;margin-bottom:8px" onclick="addDish()">＋ Add a dish manually</button>
    <button class="sec" style="width:100%;margin-bottom:8px" onclick="renameRest()">Rename restaurant</button>
    <button class="danger" style="width:100%" onclick="delRest()">Delete restaurant</button></div></div>`;
}
function addDish() {
  const r = rest(); const name = prompt("Dish name?"); if (!name) return;
  const secs = r.sections.map((s) => s.name);
  let sec = secs.length ? prompt(`Section? (${secs.join(", ")})`, secs[0]) : "Other";
  if (!sec) sec = "Other";
  let s = r.sections.find((x) => x.name.toLowerCase() === sec.toLowerCase());
  if (!s) r.sections.push(s = {name: sec, dishes: []});
  s.dishes.push({id: uid(), name, description: "", price: "", rating: 0, note: ""});
  save(); $("#sheet").innerHTML = ""; render();
}
function renameRest() { const r = rest(), n = prompt("Restaurant name", r.name); if (n) { r.name = n; save(); $("#sheet").innerHTML = ""; render(); } }
function delRest() { if (confirm("Delete this restaurant and all its ratings?")) { db.restaurants = db.restaurants.filter((x) => x.id !== view.id); save(); $("#sheet").innerHTML = ""; go({name: "home"}); } }

// ---------- add menu ----------
let draft = {name: "", sections: [], photos: [], status: "", error: ""};
function addMenu(h, m) {
  h.innerHTML = `<button class="ghost" onclick="draft={name:'',sections:[],photos:[],status:'',error:''};go({name:'home'})">‹ Cancel</button><h1>Add menu</h1>`;
  const n = draft.sections.flatMap((s) => s.dishes).length;
  m.innerHTML = `
    <label>Restaurant name</label><input id="rn" value="${esc(draft.name)}" placeholder="e.g. Luigi's Trattoria">
    <label>Menu photos</label>
    <div class="thumbs">${draft.photos.map((p) => `<img src="data:image/jpeg;base64,${p}">`).join("")}</div>
    <input id="file" type="file" accept="image/*" multiple hidden>
    <div class="row"><button class="sec grow" id="pick">📷 ${draft.photos.length ? "Add another page" : "Take / choose photo"}</button>
      ${draft.photos.length ? `<button class="grow" id="scan" ${draft.status ? "disabled" : ""}>${draft.status || "Scan menu"}</button>` : ""}</div>
    ${draft.error ? `<div class="err">${esc(draft.error)}</div>` : ""}
    ${n ? `<h2>Found ${n} dishes</h2>` + draft.sections.map((s, si) => `<div class="card"><b>${esc(s.name)}</b>
        ${s.dishes.map((d, di) => `<div class="row mute" style="padding:4px 0"><div class="grow">${esc(d.name)} <span class="price">${esc(d.price)}</span></div>
        <button class="ghost" onclick="draft.sections[${si}].dishes.splice(${di},1);render()">✕</button></div>`).join("")}</div>`).join("") +
      `<button style="width:100%" id="saveMenu">Save menu</button>` : ""}`;
  $("#rn").oninput = (e) => draft.name = e.target.value;
  $("#pick").onclick = () => $("#file").click();
  $("#file").onchange = async (e) => {
    for (const f of e.target.files) draft.photos.push(await shrink(f));
    render();
  };
  const sc = $("#scan"); if (sc) sc.onclick = scanAll;
  const sv = $("#saveMenu"); if (sv) sv.onclick = () => {
    if (!draft.name.trim()) { draft.error = "Enter the restaurant name first."; return render(); }
    const id = uid();
    db.restaurants.push({id, name: draft.name.trim(), created: Date.now(),
      sections: draft.sections.filter((s) => s.dishes.length).map((s) => ({name: s.name, dishes: s.dishes.map((d) => ({id: uid(), rating: 0, note: "", ...d}))}))});
    save(); draft = {name: "", sections: [], photos: [], status: "", error: ""}; filter = "all"; go({name: "rest", id});
  };
}

function shrink(file) { // resize to max 1800px JPEG, return base64
  return new Promise((res, rej) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const k = Math.min(1, 1800 / Math.max(img.width, img.height)), c = document.createElement("canvas");
      c.width = img.width * k; c.height = img.height * k;
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url); res(c.toDataURL("image/jpeg", 0.82).split(",")[1]);
    };
    img.onerror = () => rej(new Error("Couldn't read photo")); img.src = url;
  });
}

async function scanAll() {
  draft.error = ""; draft.sections = [];
  try {
    for (let i = 0; i < draft.photos.length; i++) {
      draft.status = `Scanning ${i + 1}/${draft.photos.length}…`; render();
      const r = await fetch("/api/scan", {method: "POST", headers: {"content-type": "application/json", "x-app-key": localStorage.getItem("mm.pass") || ""},
        body: JSON.stringify({image: draft.photos[i]})});
      const data = await r.json().catch(() => ({}));
      if (r.status === 401) { const p = prompt("Enter your app passphrase"); if (p) { localStorage.setItem("mm.pass", p); i--; continue; } throw new Error("Passphrase required"); }
      if (!r.ok) throw new Error(data.error || "Scan failed (" + r.status + ")");
      if (!draft.name && data.restaurant) draft.name = data.restaurant;
      for (const s of data.sections || []) { // merge sections across pages
        const ex = draft.sections.find((x) => x.name.toLowerCase() === s.name.toLowerCase());
        if (ex) ex.dishes.push(...s.dishes); else draft.sections.push(s);
      }
    }
    if (!draft.sections.length) draft.error = "No dishes found. Try a clearer, closer photo.";
  } catch (e) { draft.error = e.message; }
  draft.status = ""; render();
}

// ---------- settings / backup ----------
function settings() {
  $("#sheet").innerHTML = `<div class="sheet" onclick="if(event.target===this)this.parentElement.innerHTML=''"><div>
    <b>Backup</b><p class="mute">Ratings live only on this phone. Export a backup file now and then.</p>
    <button class="sec" style="width:100%;margin-bottom:8px" onclick="exportData()">Export backup</button>
    <input id="imp" type="file" accept="application/json" hidden>
    <button class="sec" style="width:100%;margin-bottom:8px" onclick="$('#imp').click()">Import backup</button>
    <button class="sec" style="width:100%" onclick="localStorage.removeItem('mm.pass');alert('Passphrase cleared')">Forget passphrase</button></div></div>`;
  $("#imp").onchange = async (e) => {
    try { const d = JSON.parse(await e.target.files[0].text()); if (!Array.isArray(d.restaurants)) throw 0; db = d; save(); $("#sheet").innerHTML = ""; render(); }
    catch { alert("That doesn't look like a backup file."); }
  };
}
function exportData() {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([JSON.stringify(db, null, 1)], {type: "application/json"}));
  a.download = "menu-memory-backup.json"; a.click();
}

if ("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js");
render();
</script>
</body>
</html>
